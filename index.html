<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人作品集 · Unity 客户端 / 游戏工具链 / 独立游戏</title>
<meta name="description" content="个人游戏作品集：可在线试玩的 demo 与历年项目试玩视频。" />
<meta property="og:type" content="website" />
<meta property="og:title" content="个人作品集 · 可试玩 Demo 与历年项目试玩录像" />
<meta property="og:description" content="Unity 客户端 / 游戏工具链 / 独立游戏 —— 在线试玩 Demo 与历年项目试玩视频。" />
<meta property="og:image" content="assets/posters/clip-0816.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root{
    --bg:#0d0f12;
    --bg-soft:#14171c;
    --card:#171a20;
    --card-hi:#1d2129;
    --line:#262b34;
    --fg:#e8eaed;
    --fg-dim:#9aa3af;
    --fg-faint:#6b7280;
    --accent:#5eead4;
    --accent-2:#a78bfa;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 12% -10%,rgba(94,234,212,.10),transparent 45%),
                     radial-gradient(circle at 88% 0%,rgba(167,139,250,.09),transparent 42%);
    background-repeat:no-repeat;
  }
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  header.top{
    position:sticky;top:0;z-index:30;
    backdrop-filter:blur(12px);
    background:rgba(13,15,18,.78);
    border-bottom:1px solid var(--line);
  }
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  nav a{color:var(--fg-dim);text-decoration:none;font-size:14px;margin-left:20px}
  nav a:hover{color:var(--fg)}

  .hero{padding:64px 0 30px}
  .hero h1{font-size:clamp(28px,4.6vw,46px);line-height:1.18;margin:0 0 14px;letter-spacing:-.5px}
  .hero h1 .grad{background:linear-gradient(92deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.lead{color:var(--fg-dim);max-width:680px;margin:0 0 22px;font-size:17px}
  .stats{display:flex;flex-wrap:wrap;gap:10px}
  .stat{border:1px solid var(--line);background:var(--bg-soft);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--fg-dim)}
  .stat b{color:var(--fg);font-weight:600}

  section{padding:26px 0 10px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:18px 0 16px}
  .sec-head h2{font-size:20px;margin:0;letter-spacing:.2px}
  .sec-head .hint{color:var(--fg-faint);font-size:13px}

  /* playable */
  .play-card{
    display:grid;grid-template-columns:1.35fr .95fr;gap:0;
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(160deg,var(--card-hi),var(--card));
  }
  .play-card .left{padding:26px 26px 24px}
  .play-card h3{margin:0 0 6px;font-size:23px}
  .play-card .sub{color:var(--accent);font-size:13px;letter-spacing:.4px;margin-bottom:12px}
  .play-card p{color:var(--fg-dim);margin:0 0 18px;font-size:15px}
  .play-card .right{position:relative;min-height:210px;border-left:1px solid var(--line);
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 12px,transparent 12px 24px),
      radial-gradient(circle at 70% 40%,rgba(94,234,212,.14),transparent 60%),#101318;
    display:flex;align-items:center;justify-content:center}
  .play-card .right .glyph{font-size:52px;filter:drop-shadow(0 0 22px rgba(94,234,212,.45))}
  .btn{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--accent);color:#07231f;text-decoration:none;
    font-weight:650;font-size:15px;padding:11px 20px;border-radius:999px;
    border:1px solid transparent;transition:transform .12s ease,filter .12s ease;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
  .btn.ghost:hover{border-color:#3a4049}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 18px}
  .chip{
    cursor:pointer;user-select:none;border:1px solid var(--line);background:var(--bg-soft);
    color:var(--fg-dim);border-radius:999px;padding:6px 13px;font-size:13px;transition:all .12s ease;
  }
  .chip:hover{color:var(--fg);border-color:#3a4049}
  .chip.on{background:var(--fg);color:#0d0f12;border-color:var(--fg);font-weight:600}
  .count{margin-left:auto;color:var(--fg-faint);font-size:13px}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:18px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;
  }
  .card.hoverable{cursor:pointer}
  .card.hoverable:hover{transform:translateY(-3px);border-color:#39414c;box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .thumb{position:relative;aspect-ratio:16/10;background:#0b0d10;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .thumb .play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45));
    opacity:0;transition:opacity .14s ease;
  }
  .card.hoverable:hover .thumb .play{opacity:1}
  .thumb .play svg{width:52px;height:52px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
  .thumb .dur{
    position:absolute;right:9px;bottom:9px;background:rgba(0,0,0,.72);color:#fff;
    font-size:12px;padding:2px 7px;border-radius:6px;letter-spacing:.3px;
  }
  .thumb.pending{
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.022) 0 11px,transparent 11px 22px),#0f1217;
    color:var(--fg-faint);font-size:13px;flex-direction:column;gap:6px;
  }
  .thumb.pending .ico{font-size:30px;opacity:.5}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card h3{margin:0;font-size:16.5px;line-height:1.4}
  .card .desc{color:var(--fg-dim);font-size:13.5px;margin:0;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tag{font-size:11.5px;color:var(--fg-dim);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:#12151a}
  .tag.year{color:var(--accent);border-color:#1f4a44}
  .tag.warn{color:#fbbf24;border-color:#4a3d1f}
  .links{display:flex;gap:14px;margin-top:4px}
  .links a{font-size:13px;color:var(--accent);text-decoration:none}
  .links a:hover{text-decoration:underline}

  footer{margin-top:46px;border-top:1px solid var(--line);padding:24px 0 44px;color:var(--fg-faint);font-size:13px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}

  /* modal */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(4,6,9,.86);backdrop-filter:blur(6px)}
  .modal.open{display:flex}
  .modal .box{width:min(1080px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .modal video{width:100%;max-height:72vh;background:#000;display:block}
  .modal .meta{padding:14px 18px 18px;display:flex;gap:18px;align-items:flex-start;justify-content:space-between}
  .modal .meta h3{margin:0 0 6px;font-size:18px}
  .modal .meta p{margin:0;color:var(--fg-dim);font-size:14px;max-width:760px}
  .modal .close{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg-dim);
    border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
  .modal .close:hover{color:var(--fg)}

  @media (max-width:820px){
    .play-card{grid-template-columns:1fr}
    .play-card .right{border-left:none;border-top:1px solid var(--line);min-height:130px}
    .hero{padding:40px 0 18px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span>个人作品集</span></div>
    <nav>
      <a href="#playable">在线试玩</a>
      <a href="#videos">试玩视频</a>
    </nav>
  </div>
</header>

<div class="wrap hero">
  <h1>游戏开发作品集<br /><span class="grad">可试玩 Demo 与历年项目试玩录像</span></h1>
  <p class="lead">覆盖 2D / 3D 客户端开发、多人实时网络、关卡编辑器与工具链、GameJam 快速原型。点击卡片即可播放试玩视频，下方「在线试玩」为可直接运行的浏览器 Demo。</p>
  <div class="stats" id="stats"></div>
</div>

<section id="playable" class="wrap">
  <div class="sec-head"><h2>在线试玩</h2><span class="hint">浏览器直接运行（WebGL）</span></div>
  <div id="playable-list"></div>
</section>

<section id="videos" class="wrap">
  <div class="sec-head"><h2>试玩视频</h2><span class="hint">点击卡片播放</span></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="grid" id="grid"></div>
</section>

<footer>
  <div class="wrap">
    <span id="foot-left"></span>
    <span id="foot-right"></span>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="box">
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="meta">
      <div>
        <h3 id="m-title"></h3>
        <p id="m-desc"></p>
      </div>
      <button class="close" id="m-close">关闭 ✕</button>
    </div>
  </div>
</div>

<script>
const PLAY_ICON = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="rgba(94,234,212,.92)"/><path d="M26 20l18 12-18 12z" fill="#07231f"/></svg>';

let DATA = {meta:{}, playable:[], videos:[]};
let activeTag = '全部';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtDur(sec){
  if(!sec) return '';
  sec = Math.round(sec);
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

function videoUrl(v){
  const ext = v.file ? v.file.split('.').pop().toLowerCase() : 'mp4';
  return 'assets/videos/' + v.slug + '.' + ext;
}

function renderStats(){
  const ready = DATA.videos.filter(v => v.status === 'ready').length;
  const years = DATA.videos.map(v => v.year).filter(Boolean).sort();
  const span = years.length ? years[0] + '–' + years[years.length-1] : '';
  $('#stats').innerHTML = [
    `<span class="stat"><b>${DATA.videos.length}</b> 段试玩录像</span>`,
    `<span class="stat"><b>${ready}</b> 段已上线</span>`,
    `<span class="stat"><b>${DATA.playable.length}</b> 个在线试玩 Demo</span>`,
    span ? `<span class="stat">时间跨度 <b>${esc(span)}</b></span>` : ''
  ].join('');
}

function renderPlayable(){
  $('#playable-list').innerHTML = DATA.playable.map(p => `
    <div class="play-card">
      <div class="left">
        <div class="sub">${esc(p.subtitle || '')}</div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.desc)}</p>
        <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">▶ 在线试玩</a>
        </div>
      </div>
      <div class="right"><div class="glyph">🎮</div></div>
    </div>`).join('');
}

function allTags(){
  const set = new Set();
  DATA.videos.forEach(v => (v.tags||[]).forEach(t => { if(t !== '待补充') set.add(t); }));
  return ['全部', ...Array.from(set)];
}

function renderToolbar(){
  $('#toolbar').innerHTML = allTags().map(t =>
    `<span class="chip${t===activeTag?' on':''}" data-tag="${esc(t)}">${esc(t)}</span>`).join('')
    + `<span class="count" id="count"></span>`;
  $('#toolbar').querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => { activeTag = el.dataset.tag; renderToolbar(); renderGrid(); });
  });
}

function renderGrid(){
  const sorted = DATA.videos.slice().sort((a,b) => (Number(b.year)||-1) - (Number(a.year)||-1));
  const list = activeTag === '全部' ? sorted : sorted.filter(v => (v.tags||[]).includes(activeTag));
  $('#grid').innerHTML = list.map(v => {
    const ready = v.status === 'ready';
    const thumb = ready
      ? `<div class="thumb">
           <img loading="lazy" src="assets/posters/${esc(v.slug)}.jpg" alt="${esc(v.title)}" />
           <div class="play">${PLAY_ICON}</div>
           ${v.duration ? `<span class="dur">${fmtDur(v.duration)}</span>` : ''}
         </div>`
      : `<div class="thumb pending"><div class="ico">⬚</div><div>视频待补充</div></div>`;
    const links = [];
    if(v.bilibili) links.push(`<a href="${esc(v.bilibili)}" target="_blank" rel="noopener">B 站完整视频 ↗</a>`);
    return `
      <article class="card${ready?' hoverable':''}" data-slug="${esc(v.slug)}"${ready?' data-playable="1"':''}>
        ${thumb}
        <div class="body">
          <h3>${esc(v.title)}</h3>
          <p class="desc">${esc(v.desc)}</p>
          <div class="tags">
            ${v.year ? `<span class="tag year">${esc(v.year)}</span>` : ''}
            ${(v.tags||[]).filter(t=>t!=='待补充').map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
            ${v.inferred ? `<span class="tag warn">归属待确认</span>` : ''}
            ${!ready ? `<span class="tag warn">视频待补充</span>` : ''}
          </div>
          ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
        </div>
      </article>`;
  }).join('');
  const c = $('#count');
  if(c) c.textContent = `${list.length} / ${DATA.videos.length} 段`;
  $('#grid').querySelectorAll('[data-playable="1"]').forEach(el => {
    el.addEventListener('click', () => openPlayer(el.dataset.slug));
  });
}

function openPlayer(slug){
  const v = DATA.videos.find(x => x.slug === slug);
  if(!v) return;
  $('#m-title').textContent = v.title + (v.year ? ' · ' + v.year : '');
  $('#m-desc').textContent = v.desc || '';
  const player = $('#player');
  player.src = videoUrl(v);
  $('#modal').classList.add('open');
  player.play().catch(()=>{});
}

function closePlayer(){
  const player = $('#player');
  player.pause();
  player.removeAttribute('src');
  player.load();
  $('#modal').classList.remove('open');
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closePlayer(); });
$('#m-close').addEventListener('click', closePlayer);
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closePlayer(); });

fetch('data/projects.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    $('#foot-left').textContent = (d.meta.title || '个人作品集') + ' · 更新于 ' + (d.meta.updated || '');
    $('#foot-right').textContent = (d.meta.subtitle || '');
    renderStats(); renderPlayable(); renderToolbar(); renderGrid();
  })
  .catch(err => {
    $('#grid').innerHTML = '<p style="color:#f87171">数据加载失败：' + esc(err.message) + '</p>';
  });
</script>
</body>
</html>
